#!/bin/bash
# ----------------------------------------------------------------------
# Test fixture: cert.conf for fast unit tests
# Uses small EC keys (prime256v1) and short passwords for speed
# CRT_SCHEME="generic" → files named client.crt, server.crt, etc.
# ----------------------------------------------------------------------

# OpenSSL Related Configuration
# -----------------------------------------------

# EC keys are fast for testing
export KEY_TYPE="EC"
export KEY_EC_CURVE="prime256v1"

# RSA keysize (unused for EC but required by config)
export KEY_SIZE=2048

# Cert Params
export KEY_COUNTRY="DE"
export KEY_PROVINCE="BERLIN"
export KEY_CITY="BERLIN"
export KEY_ORG="Test Company"
export KEY_EMAIL="test@example.com"
export KEY_OU="Unit Tests"

# x509 tool settings
# -----------------------------------------------

# Short expiry for testing
CA_EXPIRE=365
CRT_EXPIRE=365

# certificate naming scheme: generic (client.crt) or based on common name (<cn>.crt)
CRT_SCHEME="generic"

# Passwords
export PKEYPW="test1234"

# how should the ca private key password provided?
CA_PASS_TYPE="pass:testca1234"

# how should the private key password provided?
PKEY_PASS_TYPE="pass:testkey1234"

# how should the p12 password provided?
P12_PASS_TYPE="pass:testp121234"

# Certificate Common Name Templates
# -----------------------------------------------
CA_COMMON_NAME="TESTCA_%s"
ICA_COMMON_NAME="TESTICA_%s"
SRV_COMMON_NAME="TESTSRV_%s"
CLIENT_COMMON_NAME="TESTCLIENT_%s"
HOST_COMMON_NAME="TESTHOST_%s"
CODESIGNING_COMMON_NAME="TESTCODE_%s"
SMIME_COMMON_NAME="TESTMAIL_%s"
SMIME_EMAIL_NAME="%s"
